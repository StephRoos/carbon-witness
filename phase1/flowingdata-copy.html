<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Carbon Witness — Trajectoires</title>
  <style>
    body { background: #0a0a0f; margin: 0; display: flex;
           flex-direction: column; align-items: center;
           padding: 40px 0; gap: 20px; }
    canvas { border: 1px solid #222; }
  </style>
</head>
<body>
  <h1 style="color: #ccc; font-family: monospace; font-size: 18px;
             margin: 0; letter-spacing: 2px;">CARBON WITNESS</h1>
  <p style="color: #555; font-family: monospace; font-size: 11px; margin: 0;">
    100 trajectoires de décarbonation possibles — 2023 à 2050
  </p>
  <canvas id="c" width="800" height="400"></canvas>
  <script>

    const canvas = document.getElementById('c')
    const ctx = canvas.getContext('2d')

    // fond
    ctx.fillStyle = '#1a1a2e'
    ctx.fillRect(0, 0, 800, 400)

    // mapping année → pixel X
    function yearToX(year) {
      return 50 + ((year - 2023) / (2050 - 2023)) * 700
    }

    // mapping GtCO₂ → pixel Y (axe part de 0)
    function gtToY(gt) {
      return 350 - ((gt - 0) / (40 - 0)) * 300
    }

    const depart = 37  // point de départ fixe — émissions 2023

    function calculerBornes(arrivee, nSimulations) {
      const bornes = []
      for (let year = 2023; year <= 2050; year++) {
        const progression = (year - 2023) / (2050 - 2023)
        const enveloppe = Math.sin(progression * Math.PI)
        const tendance = depart + (arrivee - depart) * progression
        const valeurs = []
        for (let i = 0; i < nSimulations; i++) {
          const deviation = (Math.random() - 0.5) * 10
          valeurs.push(tendance + deviation * enveloppe + (Math.random() - 0.5) * 4 * enveloppe)
        }
        valeurs.sort((a, b) => a - b)
        bornes.push({ year, min: valeurs[0], max: valeurs[valeurs.length - 1], median: valeurs[Math.floor(nSimulations / 2)] })
      }
      return bornes
    }

    function dessinerEnveloppe(bornes, couleur) {
      ctx.fillStyle = couleur
      ctx.beginPath()
      ctx.moveTo(yearToX(bornes[0].year), gtToY(bornes[0].max))
      for (let i = 1; i < bornes.length; i++) ctx.lineTo(yearToX(bornes[i].year), gtToY(bornes[i].max))
      for (let i = bornes.length - 1; i >= 0; i--) ctx.lineTo(yearToX(bornes[i].year), gtToY(bornes[i].min))
      ctx.closePath()
      ctx.fill()

      ctx.strokeStyle = couleur.replace('0.2', '0.9')
      ctx.lineWidth = 1.5
      ctx.beginPath()
      ctx.moveTo(yearToX(bornes[0].year), gtToY(bornes[0].median))
      for (let i = 1; i < bornes.length; i++) ctx.lineTo(yearToX(bornes[i].year), gtToY(bornes[i].median))
      ctx.stroke()
    }

    // Titre du graphe
    ctx.fillStyle = '#ccc'
    ctx.font = 'bold 14px monospace'
    ctx.fillText('Émissions mondiales CO₂ — trajectoires 2023–2050 (GtCO₂/an)', 50, 30)

    // Grille horizontale
    ctx.strokeStyle = '#252535'
    ctx.lineWidth = 1
    const yTicks = [0, 10, 20, 30, 40]
    for (let i = 0; i < yTicks.length; i++) {
      const y = gtToY(yTicks[i])
      ctx.beginPath()
      ctx.moveTo(50, y)
      ctx.lineTo(750, y)
      ctx.stroke()
    }

    // Axe Y — valeurs GtCO₂
    ctx.strokeStyle = '#444'
    ctx.fillStyle = '#888'
    ctx.font = '11px monospace'
    for (let i = 0; i < yTicks.length; i++) {
      const y = gtToY(yTicks[i])
      ctx.beginPath()
      ctx.moveTo(40, y)
      ctx.lineTo(50, y)
      ctx.stroke()
      ctx.fillText(yTicks[i], 10, y + 4)
    }

    // Axe X — décennies
    const xTicks = [2023, 2030, 2040, 2050]
    for (let i = 0; i < xTicks.length; i++) {
      const x = yearToX(xTicks[i])
      ctx.beginPath()
      ctx.moveTo(x, 355)
      ctx.lineTo(x, 365)
      ctx.stroke()
      ctx.fillText(xTicks[i], x - 15, 380)
    }

    // Trois scénarios IPCC
    const scenarios = [
      { arrivee: 5,  couleur: 'rgba(74, 222, 128, 0.2)', label: '1.5°C' },
      { arrivee: 15, couleur: 'rgba(250, 204, 21, 0.2)',  label: '2°C' },
      { arrivee: 35, couleur: 'rgba(239, 68, 68, 0.2)',   label: 'Statu quo' },
    ]

    for (let s = 0; s < scenarios.length; s++) {
      const bornes = calculerBornes(scenarios[s].arrivee, 100)
      dessinerEnveloppe(bornes, scenarios[s].couleur)
      ctx.fillStyle = scenarios[s].couleur.replace('0.2', '1')
      ctx.font = '11px monospace'
      const labelW = ctx.measureText(scenarios[s].label).width
      ctx.fillText(scenarios[s].label, 790 - labelW, Math.max(gtToY(scenarios[s].arrivee) - 8, 20))
    }

  </script>
</body>
</html>
