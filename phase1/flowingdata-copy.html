<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Carbon Witness — Trajectoires</title>
  <style>
    body { background: #0a0a0f; margin: 0; display: flex;
           flex-direction: column; align-items: center;
           padding: 40px 0; gap: 20px; }
    canvas { border: 1px solid #222; }
  </style>
</head>
<body>
  <h1 style="color: #ccc; font-family: monospace; font-size: 18px;
             margin: 0; letter-spacing: 2px;">CARBON WITNESS</h1>
  <p style="color: #555; font-family: monospace; font-size: 11px; margin: 0;">
    100 trajectoires de décarbonation possibles — 2023 à 2050
  </p>
  <canvas id="c" width="800" height="400"></canvas>
  <script>

    const canvas = document.getElementById('c')
    const ctx = canvas.getContext('2d')

    // fond
    ctx.fillStyle = '#1a1a2e'
    ctx.fillRect(0, 0, 800, 400)

    // mapping année → pixel X
    function yearToX(year) {
      return 50 + ((year - 2023) / (2050 - 2023)) * 700
    }

    // mapping GtCO₂ → pixel Y (axe part de 0)
    function gtToY(gt) {
      return 350 - ((gt - 0) / (40 - 0)) * 300
    }

    // dessine une trajectoire — déviation unique par courbe, converge en 2050
    function dessinerTrajectoire(depart, arrivee, couleur) {
      const deviation = (Math.random() - 0.5) * 10  // un seul nombre aléatoire par courbe

      ctx.strokeStyle = couleur
      ctx.lineWidth = 1
      ctx.beginPath()
      ctx.moveTo(yearToX(2023), gtToY(depart))

      for (let year = 2024; year <= 2050; year++) {
        const progression = (year - 2023) / (2050 - 2023)
        const tendance = depart + (arrivee - depart) * progression  // ligne droite depart→arrivee
        const enveloppe = Math.sin(progression * Math.PI)             // 0 → 1 → 0
        const ecart = deviation * enveloppe                          // déviation structurelle
                    + (Math.random() - 0.5) * 4 * enveloppe         // bruit organique
        ctx.lineTo(yearToX(year), gtToY(tendance + ecart))
      }
      ctx.stroke()
    }

    // Trois scénarios IPCC — 33 trajectoires chacun
    const scenarios = [
      { arrivee: 5,  couleur: 'rgba(74, 222, 128, 0.12)',  label: '1.5°C' },   // vert
      { arrivee: 15, couleur: 'rgba(250, 204, 21, 0.12)',  label: '2°C' },     // jaune
      { arrivee: 35, couleur: 'rgba(239, 68, 68, 0.12)',   label: 'Statu quo' }, // rouge
    ]

    for (let s = 0; s < scenarios.length; s++) {
      for (let i = 0; i < 33; i++) {
        dessinerTrajectoire(37, scenarios[s].arrivee, scenarios[s].couleur)
      }
    }

  </script>
</body>
</html>
