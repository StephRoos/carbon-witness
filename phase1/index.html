<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Carbon Witness</title>
  <style>
    body { background: #0a0a0f; margin: 0; display: flex;
           flex-direction: column; align-items: center;
           padding: 40px 0; gap: 40px; }
    canvas { border: 1px solid #222; }
  </style>
</head>
<body>
  <canvas id="c1" width="800" height="400"></canvas>
  <canvas id="c2" width="800" height="400"></canvas>
  <script>

    // --- Fonctions de mapping partagées ---

    function yearToX(year) {
      return 50 + ((year - 1959) / (2024 - 1959)) * 700
    }

    function co2ToY(co2) {
      return 350 - ((co2 - 315) / (430 - 315)) * 300
    }

    function gtToY(gt) {
      return 350 - ((gt - 0) / (45 - 0)) * 300
    }

    // Événements partagés entre les deux graphes
    const evenements = [
      { year: 1973, label: 'Choc pétrolier', labelY: 65 },
      { year: 1992, label: 'Sommet Rio',      labelY: 65 },
      { year: 2015, label: 'Accord de Paris', labelY: 65 },
      { year: 2020, label: 'COVID',           labelY: 80 },
    ]

    // Dessine les événements historiques sur un canvas donné
    function dessinerEvenements(ctx) {
      ctx.strokeStyle = '#444'
      ctx.fillStyle = '#666'
      ctx.font = '10px monospace'
      for (let i = 0; i < evenements.length; i++) {
        const x = yearToX(evenements[i].year)
        ctx.beginPath()
        ctx.moveTo(x, 50)
        ctx.lineTo(x, 350)
        ctx.stroke()
        ctx.fillText(evenements[i].label, x + 4, evenements[i].labelY)
      }
    }

    // --- Graphe 1 : CO₂ atmosphérique ---

    function dessinerCo2(data, pointActif = null) {
      const ctx = document.getElementById('c1').getContext('2d')

      ctx.fillStyle = '#1a1a2e'
      ctx.fillRect(0, 0, 800, 400)

      ctx.fillStyle = '#ccc'
      ctx.font = 'bold 14px monospace'
      ctx.fillText('CO₂ atmosphérique — Mauna Loa (ppm)', 50, 30)

      ctx.strokeStyle = '#2a2a3e'
      ctx.lineWidth = 1
      const yTicks = [320, 340, 360, 380, 400, 420]
      for (let i = 0; i < yTicks.length; i++) {
        const y = co2ToY(yTicks[i])
        ctx.beginPath()
        ctx.moveTo(50, y)
        ctx.lineTo(750, y)
        ctx.stroke()
      }

      ctx.strokeStyle = '#444'
      ctx.fillStyle = '#888'
      ctx.font = '11px monospace'
      const xTicks = [1960, 1970, 1980, 1990, 2000, 2010, 2020]
      for (let i = 0; i < xTicks.length; i++) {
        const x = yearToX(xTicks[i])
        ctx.beginPath()
        ctx.moveTo(x, 355)
        ctx.lineTo(x, 365)
        ctx.stroke()
        ctx.fillText(xTicks[i], x - 15, 380)
      }

      for (let i = 0; i < yTicks.length; i++) {
        const y = co2ToY(yTicks[i])
        ctx.beginPath()
        ctx.moveTo(40, y)
        ctx.lineTo(50, y)
        ctx.stroke()
        ctx.fillText(yTicks[i], 5, y + 4)
      }

      ctx.strokeStyle = '#ef4444'
      ctx.lineWidth = 1
      ctx.setLineDash([6, 3])
      ctx.beginPath()
      ctx.moveTo(50, co2ToY(350))
      ctx.lineTo(750, co2ToY(350))
      ctx.stroke()
      ctx.setLineDash([])
      ctx.fillStyle = '#ef4444'
      const labelSeuil = '350 ppm — seuil sûr'
      ctx.fillText(labelSeuil, 750 - ctx.measureText(labelSeuil).width, co2ToY(350) + 14)

      // Annotation — franchissement du seuil
      ctx.fillText('↑ franchi ~1988', yearToX(1960) + 5, co2ToY(350) - 16)
      ctx.font = '10px monospace'
      ctx.fillText('Hansen : risque climatique significatif', yearToX(1960) + 5, co2ToY(350) - 4)

      // Événements historiques
      dessinerEvenements(ctx)

      ctx.strokeStyle = '#f97316'
      ctx.lineWidth = 2
      ctx.beginPath()
      ctx.moveTo(yearToX(data[0].year), co2ToY(data[0].co2))
      for (let i = 1; i < data.length; i++) {
        ctx.lineTo(yearToX(data[i].year), co2ToY(data[i].co2))
      }
      ctx.stroke()

      for (let i = 0; i < data.length; i++) {
        const estActif = pointActif && data[i].year === pointActif.year
        ctx.fillStyle = estActif ? '#fff' : '#f97316'  // blanc si survolé, orange sinon
        const rayon = estActif ? 6 : 3                 // plus grand si survolé
        ctx.beginPath()
        ctx.arc(yearToX(data[i].year), co2ToY(data[i].co2), rayon, 0, Math.PI * 2)
        ctx.fill()
      }
    }

    // --- Graphe 2 : émissions mondiales ---

    function dessinerEmissions(data, pointActif = null) {
      const ctx = document.getElementById('c2').getContext('2d')

      ctx.fillStyle = '#1a1a2e'
      ctx.fillRect(0, 0, 800, 400)

      ctx.fillStyle = '#ccc'
      ctx.font = 'bold 14px monospace'
      ctx.fillText('Émissions mondiales CO₂ — fossiles (GtCO₂/an)', 50, 30)

      ctx.strokeStyle = '#2a2a3e'
      ctx.lineWidth = 1
      const yTicks = [0, 10, 20, 30, 40]
      for (let i = 0; i < yTicks.length; i++) {
        const y = gtToY(yTicks[i])
        ctx.beginPath()
        ctx.moveTo(50, y)
        ctx.lineTo(750, y)
        ctx.stroke()
      }

      ctx.strokeStyle = '#444'
      ctx.fillStyle = '#888'
      ctx.font = '11px monospace'
      const xTicks = [1960, 1970, 1980, 1990, 2000, 2010, 2020]
      for (let i = 0; i < xTicks.length; i++) {
        const x = yearToX(xTicks[i])
        ctx.beginPath()
        ctx.moveTo(x, 355)
        ctx.lineTo(x, 365)
        ctx.stroke()
        ctx.fillText(xTicks[i], x - 15, 380)
      }

      for (let i = 0; i < yTicks.length; i++) {
        const y = gtToY(yTicks[i])
        ctx.beginPath()
        ctx.moveTo(40, y)
        ctx.lineTo(50, y)
        ctx.stroke()
        ctx.fillText(yTicks[i], 10, y + 4)
      }

      const pente = (17.5 - 35.4) / (2030 - 2015)
      ctx.strokeStyle = '#ef4444'
      ctx.lineWidth = 1
      ctx.setLineDash([6, 3])
      ctx.beginPath()
      ctx.moveTo(yearToX(2015), gtToY(35.4))
      ctx.lineTo(750, gtToY(35.4 + pente * (2023 - 2015)))  // s'arrête au bord droit
      ctx.stroke()
      ctx.setLineDash([])
      ctx.fillStyle = '#ef4444'
      const label = 'Trajectoire Paris +1.5°C'
      const labelWidth = ctx.measureText(label).width   // largeur du texte en pixels
      ctx.fillText(label, yearToX(2022) - labelWidth, gtToY(25))

      // Événements historiques
      const evenements = [
        { year: 1973, label: 'Choc pétrolier', labelY: 65 },
        { year: 1992, label: 'Sommet Rio',      labelY: 65 },
        { year: 2015, label: 'Accord de Paris', labelY: 65 },
        { year: 2020, label: 'COVID',           labelY: 80 },  // décalé plus bas
      ]
      ctx.strokeStyle = '#444'
      ctx.fillStyle = '#666'
      ctx.font = '10px monospace'
      for (let i = 0; i < evenements.length; i++) {
        const x = yearToX(evenements[i].year)
        ctx.beginPath()
        ctx.moveTo(x, 50)
        ctx.lineTo(x, 350)
        ctx.stroke()
        ctx.fillText(evenements[i].label, x + 4, evenements[i].labelY)
      }

      ctx.strokeStyle = '#f97316'
      ctx.lineWidth = 2
      ctx.beginPath()
      ctx.moveTo(yearToX(data[0].year), gtToY(data[0].gt))
      for (let i = 1; i < data.length; i++) {
        ctx.lineTo(yearToX(data[i].year), gtToY(data[i].gt))
      }
      ctx.stroke()

      for (let i = 0; i < data.length; i++) {
        const estActif = pointActif && data[i].year === pointActif.year
        ctx.fillStyle = estActif ? '#fff' : '#f97316'
        const rayon = estActif ? 6 : 3
        ctx.beginPath()
        ctx.arc(yearToX(data[i].year), gtToY(data[i].gt), rayon, 0, Math.PI * 2)
        ctx.fill()
      }
    }

    // --- Détection de proximité ---

    function distance(x1, y1, x2, y2) {
      return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2)
    }

    function dessinerLigneVerticale(canvasId, annee) {
      if (!annee) return                              // rien à faire si pas d'année
      const ctx = document.getElementById(canvasId).getContext('2d')
      ctx.strokeStyle = '#555'
      ctx.lineWidth = 1
      ctx.setLineDash([3, 3])
      ctx.beginPath()
      ctx.moveTo(yearToX(annee), 50)
      ctx.lineTo(yearToX(annee), 350)
      ctx.stroke()
      ctx.setLineDash([])
    }

    // --- Chargement des données ---
    let co2Data = []       // tableau vide au départ, accessible partout
    let emissionsData = []
    let anneeActive = null // année survolée, partagée entre les deux listeners

    fetch('co2.json')
      .then(r => r.json())
      .then(data => {
          co2Data = data        // on remplit la variable globale
          dessinerCo2(co2Data)
      })

    fetch('emissions.json')
      .then(r => r.json())
      .then(data => {
        emissionsData = data
        dessinerEmissions(emissionsData)
      })

      // Récupère la position de la souris relative au canvas
  document.getElementById('c1').addEventListener('mousemove', function(event) {
      const rect = this.getBoundingClientRect()
      const mouseX = event.clientX - rect.left
      const mouseY = event.clientY - rect.top

      let pointSurvole = null
      for (let i = 0; i < co2Data.length; i++) {
        const px = yearToX(co2Data[i].year)
        const py = co2ToY(co2Data[i].co2)
        if (distance(mouseX, mouseY, px, py) < 10) {
          pointSurvole = co2Data[i]
        }
      }
      anneeActive = pointSurvole ? pointSurvole.year : null  // met à jour l'état partagé
      dessinerCo2(co2Data, pointSurvole)       // redessine c1
      dessinerEmissions(emissionsData)         // redessine c2
      dessinerLigneVerticale('c1', anneeActive)  // ligne par-dessus c1
      dessinerLigneVerticale('c2', anneeActive)  // ligne par-dessus c2
      if (pointSurvole) {
        const ctx = document.getElementById('c1').getContext('2d')
        const x = yearToX(pointSurvole.year)
        const y = co2ToY(pointSurvole.co2)
        ctx.fillStyle = '#fff'
        ctx.font = '12px monospace'
        ctx.fillText(pointSurvole.year + ' — ' + pointSurvole.co2 + ' ppm', x + 8, y - 8)
      }
  })

  document.getElementById('c2').addEventListener('mousemove', function(event) {
      const rect = this.getBoundingClientRect()
      const mouseX = event.clientX - rect.left
      const mouseY = event.clientY - rect.top

      let pointSurvole = null
      for (let i = 0; i < emissionsData.length; i++) {
        const px = yearToX(emissionsData[i].year)
        const py = gtToY(emissionsData[i].gt)
        if (distance(mouseX, mouseY, px, py) < 10) {
          pointSurvole = emissionsData[i]
        }
      }
      anneeActive = pointSurvole ? pointSurvole.year : null
      dessinerCo2(co2Data)                     // redessine c1
      dessinerEmissions(emissionsData, pointSurvole)  // redessine c2
      dessinerLigneVerticale('c1', anneeActive)  // ligne par-dessus c1
      dessinerLigneVerticale('c2', anneeActive)  // ligne par-dessus c2
      if (pointSurvole) {
        const ctx = document.getElementById('c2').getContext('2d')
        const x = yearToX(pointSurvole.year)
        const y = gtToY(pointSurvole.gt)
        ctx.fillStyle = '#fff'
        ctx.font = '12px monospace'
        ctx.fillText(pointSurvole.year + ' — ' + pointSurvole.gt + ' GtCO₂', x + 8, y - 8)
      }
  })

  </script>
</body>
</html>
