<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Carbon Witness — Émissions</title>
  <style>
    body { background: #0a0a0f; margin: 0; display: flex;
           justify-content: center; align-items: center; height: 100vh; }
    canvas { border: 1px solid #222; }
  </style>
</head>
<body>
  <canvas id="c" width="800" height="400"></canvas>
  <script>
    const canvas = document.getElementById('c')
    const ctx = canvas.getContext('2d')

    function yearToX(year) {
      return 50 + ((year - 1959) / (2023 - 1959)) * 700
    }

    function gtToY(gt) {
      return 350 - ((gt - 0) / (45 - 0)) * 300  // axe part de 0, pas du min des données
    }

    function dessiner(data) {

      // fond
      ctx.fillStyle = '#1a1a2e'
      ctx.fillRect(0, 0, 800, 400)

      // titre
      ctx.fillStyle = '#ccc'
      ctx.font = 'bold 14px monospace'
      ctx.fillText('Émissions mondiales CO₂ — fossiles (GtCO₂/an)', 50, 30)

      // grille horizontale
      ctx.strokeStyle = '#2a2a3e'
      ctx.lineWidth = 1
      const yTicks = [0, 10, 20, 30, 40]
      for (let i = 0; i < yTicks.length; i++) {
        const y = gtToY(yTicks[i])
        ctx.beginPath()
        ctx.moveTo(50, y)
        ctx.lineTo(750, y)
        ctx.stroke()
      }

      // axe X — décennies
      ctx.strokeStyle = '#444'
      ctx.fillStyle = '#888'
      ctx.font = '11px monospace'
      const xTicks = [1960, 1970, 1980, 1990, 2000, 2010, 2020]
      for (let i = 0; i < xTicks.length; i++) {
        const x = yearToX(xTicks[i])
        ctx.beginPath()
        ctx.moveTo(x, 355)
        ctx.lineTo(x, 365)
        ctx.stroke()
        ctx.fillText(xTicks[i], x - 15, 380)
      }

      // axe Y — étiquettes GtCO₂
      for (let i = 0; i < yTicks.length; i++) {
        const y = gtToY(yTicks[i])
        ctx.beginPath()
        ctx.moveTo(40, y)
        ctx.lineTo(50, y)
        ctx.stroke()
        ctx.fillText(yTicks[i], 10, y + 4)
      }

      // trajectoire Paris 2015 — descente linéaire vers -50% en 2030
      const pente = (17.5 - 35.4) / (2030 - 2015)  // GtCO₂ perdus par an
      ctx.strokeStyle = '#ef4444'
      ctx.lineWidth = 1
      ctx.setLineDash([6, 3])
      ctx.beginPath()
      ctx.moveTo(yearToX(2015), gtToY(35.4))
      ctx.lineTo(yearToX(2030), gtToY(35.4 + pente * (2030 - 2015)))
      ctx.stroke()
      ctx.setLineDash([])
      ctx.fillStyle = '#ef4444'
      ctx.fillText('Trajectoire Paris +1.5°C', yearToX(2015) + 5, gtToY(35.4) - 8)

      // courbe émissions
      ctx.strokeStyle = '#f97316'
      ctx.lineWidth = 2
      ctx.beginPath()
      ctx.moveTo(yearToX(data[0].year), gtToY(data[0].gt))
      for (let i = 1; i < data.length; i++) {
        ctx.lineTo(yearToX(data[i].year), gtToY(data[i].gt))
      }
      ctx.stroke()

    }

    fetch('emissions.json')
      .then(r => r.json())
      .then(data => dessiner(data))

  </script>
</body>
</html>
